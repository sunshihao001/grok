name: tests

on:
  push:
    # PR #23 remains Draft with conflicts; branch CI still needs to validate knowledge and evidence changes.
    branches: [main, integration/blix-evidence-readonly-20261108]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run test:security
        if: ${{ !cancelled() }}
      - run: npm run test:evidence
        if: ${{ !cancelled() }}
      # Static frontend compilation only; never start the trading-capable Blix server.
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
        if: ${{ !cancelled() }}
      - run: npm --prefix web run build
        if: ${{ !cancelled() }}
