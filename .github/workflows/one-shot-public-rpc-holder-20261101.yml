# Rerun once after AMM/pool-owner collision rejection: 2026-11-01
name: one-shot-public-rugcheck-readonly
on:
  push:
    branches:
      - research/p24-cross-mint-m01-batch-monitor-20261031
    paths:
      - .github/workflows/one-shot-public-rpc-holder-20261101.yml
permissions:
  contents: read
jobs:
  one-read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Once - fixed public Mint, DEX Screener and RugCheck cached GET
        shell: bash
        run: |
          set +e
          mkdir -p .runtime/one-shot
          MINT=EYqygbhZjP7EbM4fSn8devctnksAvPAD1Bt57XBFpump
          PYTHONPATH=src python -m solana_meme_os.mint_v01 "$MINT" --rugcheck --out-dir .runtime/one-shot/mint >.runtime/one-shot/stdout.txt 2>.runtime/one-shot/stderr.txt
          status=$?
          printf '{"program_exit_code": %s, "automatic_payment": false, "wallet_signing": false}\n' "$status" > .runtime/one-shot/exit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.runtime/one-shot/mint/report.json')
          if p.exists():
              report=json.loads(p.read_text())
              print('REAL_SOURCE_STATUSES',json.dumps(report.get('source_status',{})))
              print('SOURCE_ERRORS',json.dumps(report.get('source_errors',{})))
              print('RUGCHECK_HOLDER_COUNT',report.get('rugcheck_public',{}).get('top_holders_rows_returned') if report.get('rugcheck_public') else 'NOT_AVAILABLE')
              print('RUGCHECK_CREATOR',report.get('rugcheck_public',{}).get('creator_vendor_candidate') if report.get('rugcheck_public') else 'NOT_AVAILABLE')
          else:
              print('NO_REPORT; see stderr in artifact')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-mint-rugcheck-readonly-20261101
          path: .runtime/one-shot/
          retention-days: 14
