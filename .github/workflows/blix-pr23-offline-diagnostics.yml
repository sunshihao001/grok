name: Blix PR23 isolated test-file diagnosis
on:
  push:
    branches: [audit/blix-pr21-regression-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BLIX_MARKET_FEEDS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eade9072d28ac8fc088c8af3a7b58376ac6a6ce5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check economic-events cases
        continue-on-error: true
        run: node --no-warnings --test test/economic-events.test.mjs
      - name: Check retry and hook acknowledgement cases
        continue-on-error: true
        run: node --no-warnings --test test/wallet-evidence-retry.test.mjs
      - name: Check signature discovery checkpoint cases
        continue-on-error: true
        run: node --no-warnings --test test/wallet-signature-coverage.test.mjs
      - name: Check synthetic cross-Mint economic chain cases
        continue-on-error: true
        run: node --no-warnings --test test/wallet-evidence-chain.test.mjs
      - name: Combined evidence suite with default concurrency
        continue-on-error: true
        run: npm run test:evidence
      - name: Combined evidence suite with explicit serial process execution
        continue-on-error: true
        run: node --no-warnings --test --test-concurrency=1 test/economic-events.test.mjs test/wallet-evidence-retry.test.mjs test/wallet-signature-coverage.test.mjs test/wallet-evidence-chain.test.mjs
      - name: Full regression suite before an evidence rerun
        continue-on-error: true
        run: npm test
      - name: Evidence suite rerun after full regression
        continue-on-error: true
        run: npm run test:evidence
      - name: Independent security suite
        continue-on-error: true
        run: npm run test:security
