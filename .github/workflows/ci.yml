name: monitor-tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: One-off V0.1 actual RugCheck cached report (safe GET only)
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m solana_meme_os.mint_v01 EYqygbhZjP7EbM4fSn8devctnksAvPAD1Bt57XBFpump --rugcheck --out-dir .runtime/rugcheck-verification/EYqygbhZjP7EbM4fSn8devctnksAvPAD1Bt57XBFpump
          test ! -f .runtime/rugcheck-verification/EYqygbhZjP7EbM4fSn8devctnksAvPAD1Bt57XBFpump/report.json || python -c "import json; x=json.load(open('.runtime/rugcheck-verification/EYqygbhZjP7EbM4fSn8devctnksAvPAD1Bt57XBFpump/report.json')); print('sources',x['source_status']); r=x.get('rugcheck_public') or {}; print('holders',len(r.get('top_holders',[])),'creator_present',bool(r.get('creator_vendor_candidate')),'error',x['source_errors'].get('rugcheck_public_report'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v01-rugcheck-public-mint-one-time
          path: .runtime/rugcheck-verification/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
