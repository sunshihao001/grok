# One-time vendor source import. This file removes itself when the source tree replaces this branch.
name: import-blix-snapshot
on:
  push:
    branches: [blix]
    paths:
      - .github/workflows/import-blix-snapshot.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the exact reviewed Blix snapshot (never execute its scripts)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/blixvip/blixtrade.git "$RUNNER_TEMP/blix-source"
          actual="$(git -C "$RUNNER_TEMP/blix-source" rev-parse HEAD)"
          expected="51c0dac14c9dad27625ab9d7fe402e110f7ec862"
          echo "Blix upstream snapshot: $actual"
          test "$actual" = "$expected" || { echo "Upstream moved: refuse unreviewed import"; exit 1; }
      - name: Replace only the blix branch content with the entire upstream tree
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "blix"
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/blix-source/" "$GITHUB_WORKSPACE/"
          git add -A
          if git diff --cached --quiet; then echo "Already identical"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import full Blix source snapshot 51c0dac (MIT)"
          git push origin HEAD:blix
